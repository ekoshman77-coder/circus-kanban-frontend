<div class="action-center-container">
  <h2 class="center-title">⚡ Quick Action Center</h2>
  
  <div class="modus-toggle-wrapper">
    <button 
      class="toggle-btn" 
      [class.active]="actuelModus() === QuickPanelMode.ACTIVE"
      (click)="setModus(QuickPanelMode.ACTIVE)">
      🚀 Arbeits-Fokus
    </button>
    <button 
      class="toggle-btn" 
      [class.class-pause]="true"
      [class.active]="actuelModus() === QuickPanelMode.PAUSE"
      (click)="setModus(QuickPanelMode.PAUSE)">
      ☕ Pausen-Modus
    </button>
  </div>

  <div class="quick-milestone-wrapper" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700; color: #64748b;">Ziel-Meilenstein:</span>
    <app-milestone-selector-component 
        [initialMilestoneId]="newMilestoneId()"
        (milestoneSelected)="onMilestoneSelected($any($event))">
    </app-milestone-selector-component>
  </div>

  <div class="panel-card-wrapper">
    <app-quick-panel-component
        [currentModus]="actuelModus()"
        (todoSelected)="onTaskSelected($event)">
    </app-quick-panel-component>
  </div>  

  @if (toastMessage()) {
    <div class="toast-notification persistent">
      <div class="toast-content">
        <span class="toast-icon">✓</span>
        <div class="toast-text-container">
          <p class="toast-text">{{ toastMessage() }}</p>
        </div>
        <button class="toast-close-btn" (click)="closeToast()">OK</button>
      </div>
    </div>
  }
</div>
