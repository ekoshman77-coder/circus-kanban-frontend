<div class="dashboard-wrapper">
  
  <div class="dashboard-grid">
    
    <div class="dashboard-card personal-card">
      <div class="card-header">
        <span class="card-icon">👤</span>
        <h3>Mein Fortschritt</h3>
      </div>
      <div class="card-body">
        <div class="big-number">{{ personalProgress() }}%</div>
        <p>{{textLabel()}}</p>
        
        <div class="progress-bar-container">
          <div class="progress-bar-fill" [style.width.%]="personalProgress()"></div>
        </div>
      </div>
    </div>

    <div class="dashboard-card team-card">
      <div class="card-header">
        <span class="card-icon">👥</span>
        <h3>Team Sprint-Fortschritt</h3>
      </div>
      <div class="card-body">
        <div class="big-number">{{ teamProgress() }}%</div>
        <p>{{textLabel()}}</p>
        
        <div class="progress-bar-container">
          <div class="progress-bar-fill team-fill" [style.width.%]="teamProgress()"></div>
        </div>
      </div>
    </div>

    <div class="dashboard-card project-card">
      <div class="card-header">
        <span class="card-icon">🚀</span>
        <h3>Aktive Projekte</h3>
      </div>
      <div class="card-body">
        <div class="big-number">{{ activeProjectsCount() }}</div>
        <p>Projekte im Ideenboard aktiv</p>
      </div>
    </div>

    <div class="dashboard-card notes-card">
      <div class="card-header">
        <span class="card-icon">💡</span>
        <h3>Wissens-Datenbank</h3>
      </div>
      <div class="card-body">
        <div class="big-number">{{ notesCount() }}</div>
        <p>Notizen & Geistesblitze gesichert</p>
      </div>
    </div>

  </div>

</div>
