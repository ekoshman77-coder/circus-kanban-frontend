<div class="statistic-dashboard-container">
  
  <div class="stats-header">
    <h2 class="stats-title">📊 Analyse-Zentrum</h2>
    
    <div class="mode-toggle-group">
      <button 
        class="mode-btn" 
        [class.active]="currentMode() === 'tasks'" 
        (click)="setMode('tasks')">
        📋 Aufgaben
      </button>
      <button 
        class="mode-btn" 
        [class.active]="currentMode() === 'points'" 
        (click)="setMode('points')">
        🎯 Punkte (Fibonacci)
      </button>
    </div>
  </div>

  <div class="stats-tabs-bar">
    <button 
      class="tab-link" 
      [class.active]="currentTab() === 'overview'" 
      (click)="setTab('overview')">
      🔍 Überblick
    </button>
    <button 
      class="tab-link" 
      [class.active]="currentTab() === 'performance'" 
      (click)="setTab('performance')">
      ⚡ Performance & Fokus
    </button>
    <button 
      class="tab-link" 
      [class.active]="currentTab() === 'workload'" 
      (click)="setTab('workload')">
      ⏳ Tages-Auslastung
    </button>
  </div>

  <div class="stats-page-content">
    
    @if (currentTab() === 'overview') {
      <app-stats-overview 
        [mode]="currentMode()"
        [totalCount]="allTodos.length"
        [openTodos]="openTodos()"
        [completedTodos]="completedTodos()"
        [overdueTodos]="overdueTodos()">
      </app-stats-overview>
    }

    @if (currentTab() === 'performance') {
      <app-stats-performance 
        [mode]="currentMode()"
        [completedTodos]="completedTodos()">
      </app-stats-performance>
    }

    @if (currentTab() === 'workload') {
      <app-stats-workload 
        [mode]="currentMode()"
        [todayTodos]="todayTodos()">
      </app-stats-workload>
    }

  </div>
</div>
