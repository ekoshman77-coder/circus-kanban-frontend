<div class="statistic-dashboard-container">

  <div class="stats-header">
    <h2 class="stats-title">📊 Analyse-Zentrum</h2>

    <div class="mode-toggle-group">
      <button class="mode-btn" [class.active]="currentMode() === 'tasks'" (click)="setMode('tasks')">
        📋 Aufgaben
      </button>
      <button class="mode-btn" [class.active]="currentMode() === 'points'" (click)="setMode('points')">
        🎯 Punkte (Fibonacci)
      </button>
    </div>
  </div>

  <div class="stats-tabs-bar">
    <button class="tab-link" [class.active]="currentTab() === 'statistic-overview'"
      (click)="setTab('statistic-overview')">
      📊 Globales Dashboard
    </button>
    <button class="tab-link" [class.active]="currentTab() === 'todo-overview'" (click)="setTab('todo-overview')">
      📋 To-Do Überblick
    </button>
    <button class="tab-link" [class.active]="currentTab() === 'performance'" (click)="setTab('performance')">
      ⚡ Performance & Fokus
    </button>
    <button class="tab-link" [class.active]="currentTab() === 'workload'" (click)="setTab('workload')">
      ⏳ Tages-Auslastung
    </button>
  </div>

  <div class="stats-page-content">
    @switch(currentTab()) {
      @case ('statistic-overview') {
       <app-statistic-overview-component 
          [myProjects]="myProjects()" 
         [myTeamTodos]="myTeamTodos()"
         [teamTodos]="teamTodos()"
         [mode]="currentMode()">
       </app-statistic-overview-component>    
     }

     @case ('todo-overview'){
       <app-todo-overview 
          [privateTodos]="privateTodos()" 
          [teamTodos]="teamTodos()" 
          [myTeamTodos]="myTeamTodos()"
          [inMyReviewTodos]="inMyReviewTodos()" 
          [inOtherReviewTodos]="inOtherReviewTodos()"
          [completedReviewedTodos]="completedReviewedTodos()" 
          [myProjects]="myProjects()" 
          [mode]="currentMode()">
        </app-todo-overview>
     }

     @case ('performance'){
    <!-- Ansichts-Filter -->
    <app-stats-performance 
      [mode]="currentMode()" 
      [completedTodos]="filteredCompletedTodos()"
      [streakInfo]="streakInfo()" 
      [myProjects]="myProjects()">
    </app-stats-performance>
    }
    @case ('workload'){
    <app-stats-workload 
      [mode]="currentMode()" 
      [todayTodos]="todayTodos()">
    </app-stats-workload>
    }
    }
  </div>
</div>
