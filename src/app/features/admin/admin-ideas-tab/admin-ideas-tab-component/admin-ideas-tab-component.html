<div class="tabs-container">
    <button class="tab" 
       [class.active]="activeTab()==='departments-idea'" 
       (click)="onTabClick('departments-idea')">
       🏢 Abteilungs-Ideen
    </button>
    <button 
      class="tab" 
      [class.active]="activeTab()==='companies-idea'" 
      (click)="onTabClick('companies-idea')">
      🚀 Company-Ideen
    </button>
</div>

<div class="content-container">
   @switch(activeTab()){
    @case('departments-idea') {
        <app-admin-depts-idea-component>
        </app-admin-depts-idea-component>
    }
    @case('companies-idea') {
        <app-admin-companies-idea-component>
        </app-admin-companies-idea-component>
    }
   }
</div>
