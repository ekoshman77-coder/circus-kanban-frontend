<div class="admin-board-container">
  <h1>👑 Administrator-Zentrale</h1>

  <!-- Die Reiter-Leiste mit Glassmorphism -->
  <div class="tab-navigation">
    <button 
      [class.active]="activeTab() === 'departments'" 
      (click)="changeTab('departments')">
      🏢 Abteilungen verwalten
    </button>
    <button 
      [class.active]="activeTab() === 'users'" 
      (click)="changeTab('users')">
      👥 Benutzer & Warteraum
    </button>
    <button 
      [class.active]="activeTab() === 'permissions'" 
      (click)="changeTab('permissions')">
      🔐 Permissions
    </button>
  </div>

  <!-- Der dynamische Content-Bereich mit individuellem Gradient-Glass-Look -->
  <div class="tab-content" [ngClass]="'tab-' + activeTab()">
    @if (activeTab() === 'departments') {
      <app-departments-component></app-departments-component>
    }
    @if (activeTab() === 'users') {
      <app-admin-users-component></app-admin-users-component>
    }
    @if (activeTab() === 'permissions') {
      <app-permissions-component></app-permissions-component>
    }
  </div>
</div>
