<div class="todo-list-container">

  <div class="controls-wrapper">
    <app-filter 
      [currentFilter]="currentFilter" 
      [availableFilters]="availableFilters"
      (filterChanged)="onFilterChange($event)">
    </app-filter>

<app-statistic [todos]="todosForStats()"></app-statistic>
  </div>

  <h3>Deine Aufgaben ({{ uiTodos().length }})</h3>

  @if (uiTodos().length === 0) {
    @let msg = emptyFilterMessage();
    <div class="empty-filter-state">
      <div class="empty-icon">{{ msg?.icon }}</div>
      <h3>{{ msg?.title }}</h3>
      <p>{{ msg?.text }}</p>
    </div>
  } @else {
    <div class="todo-grid-layout">
      @for (item of uiTodos(); track item.id) {
        <div @filterAnimation class="grid-item-wrapper">
          <app-todo-item 
            [item]="item" 
            [isDescriptionOpen]="item.isDescriptionOpen"
            [isKanbanMode]="false"
            [ngClass]="'status-' + item.visualStatus" 
            (toggleDescription)="toggleDescription(item.id)"
            (delete)="onDeleteTodo(item.id)">
          </app-todo-item>
        </div>
      }
    </div>
  }
<app-todo-footer 
  [currentTodos]="todosForStats()"
  (requestClearCompleted)="onOpenClearCompletedPopup()"
  (requestClearAll)="onOpenClearAllPopup()">
</app-todo-footer>
</div>

<!-- 🔮 POPUP-PORTAL: Sitzt jetzt perfekt auf Root-Ebene der TodoPage! -->
@if (activePopupConfig(); as config) {
  <app-universal-popup-component
    [title]="config.title"
    [message]="config.message"
    [mode]="config.mode"
    [animationIcon]="config.animationIcon"
    [confirmText]="config.confirmText || null"
    [cancelText]="config.cancelText"
    [showLoadingBar]="config.showLoadingBar"
    [timerMs]="config.timerMs"
    (confirm)="config.action(); closePopup()"
    (cancel)="closePopup()">
  </app-universal-popup-component>
}
