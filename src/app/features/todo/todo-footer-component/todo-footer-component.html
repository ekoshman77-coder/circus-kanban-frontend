@if (!isListEmpty) {
  <div class="actions">
    <span 
      [class.delete-completed-btn]="!disableDeleteButtons()"
      [class.disable-btn]="disableDeleteButtons()" 
      [attr.title]="disableDeleteButtons() ? 'Diese Funktion ist offline nicht verfügbar 🔌' : null"
      (click)="disableDeleteButtons() ? null : onClearCompleted()">
      🗑️ Erledigte private Aufgaben löschen
    </span>
    
    <span class="total-time-display">
      Offener Aufwand: {{ totalOpenEffort }} Story Points
    </span>
    
    <span 
      [class.delete-all-btn]="!disableDeleteButtons()"
      [class.disable-btn]="disableDeleteButtons()" 
      [attr.title]="disableDeleteButtons() ? 'Diese Funktion ist offline nicht verfügbar 🔌' : null"
      (click)="disableDeleteButtons() ? null : onClearAll()">
      🔥 Alle privaten Aufgaben löschen
    </span>
  </div>
}
