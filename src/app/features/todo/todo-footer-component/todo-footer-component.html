@if (!isListEmpty()) {
  <div class="actions">
    <span 
      [class.delete-completed-btn]="true"
      (click)="requestClearCompleted.emit()">
      🗑️ Erledigte private Aufgaben löschen
    </span>
    
    <span class="total-time-display">
      Offener Aufwand: {{ totalOpenEffort() }} Story Points
    </span>
    
    <span 
      [class.delete-all-btn]="true"
       (click)="requestClearAll.emit()">
      🔥 Alle privaten Aufgaben löschen
    </span>
  </div>
}
