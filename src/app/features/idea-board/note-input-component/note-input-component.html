<div class="note-input-card" [class]="'note-input-card ' + newColor()">
  
  <div class="form-group">
    <input 
      type="text" 
      [(ngModel)]="newTitle" 
      placeholder="Titel deiner Idee..." 
      class="form-control" />
  </div>

  <div class="form-group">
    <textarea 
      [(ngModel)]="newContent" 
      placeholder="Beschreibung..." 
      class="form-control" 
      rows="2"></textarea> </div>

  <div class="form-row">
    <div class="form-group flex-grow">
      <app-universal-tag-input-component 
        [textToWatch]="newTitle()" 
        [contextType]="'note'"
        [placeholder]="'Kategorie...'" 
        [initialValue]="newTag()"
        (valueChanged)="onTagChanged($event)">
      </app-universal-tag-input-component>
    </div>

    <div class="form-group color-select-wrapper">
      <select [(ngModel)]="newColor" class="select-field">
        @for (color of colorPalette; track color.value) {
          <option [value]="color.value">{{ color.label }}</option>
        }
      </select>
    </div>
  </div>

<button 
    (click)="saveNote()" 
    [disabled]="!newTitle().trim() || !newContent().trim()" 
    class="btn-save">
    Auf Pinnwand hämmern! 🚀
  </button>
</div>
