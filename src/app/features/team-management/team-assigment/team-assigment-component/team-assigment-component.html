<div class="assignment-container">
  
  <div class="project-selector">
    <label for="projectSelect">📅 Projekt auswählen:</label>
    <select id="projectSelect" (change)="onProjectChange($event)">
      <option [value]="null" [selected]="selectedProjectId() === null">
        -- Bitte Projekt wählen --
      </option>
      @for (project of allProjects(); track project.id) {
        <option [value]="project.id">
          {{ project.title }}
        </option>
      }
    </select>
  </div>

  <hr class="divider">

  <div class="assignment-content">
    <h3 class="section-title">👥 Projektmitglieder & Zuweisung</h3>

    @if (selectedProjectId()) {
      <div class="assignment-split-view">
        
        <app-project-members-list 
          [members]="activeMembers()" 
          (removeUser)="onRemoveUserFromProject($event)"
          (addUser)="onAddUserToProject($event)">
        </app-project-members-list>

        <app-available-pool-list 
          [pool]="availablePool()" 
          (addUser)="onAddUserToProject($event)">
        </app-available-pool-list>

      </div>
    } @else {
      <p class="hint-msg">Bitte wähle oben ein Projekt aus, um Mitglieder zu verwalten. 📂</p>
    }
  </div>

  @if (showRoleModal()) {
    <div class="modal-backdrop" (click)="onCloseRoleModal()" style="position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.4); display:flex; justify-content:center; align-items:center; z-index:9999;">
      <div class="modal-box" (click)="$event.stopPropagation()" style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 400px; max-width: 90%;">
        
        <h3 style="margin-top: 0; margin-bottom: 8px;">💼 Projektrolle zuweisen</h3>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">
          Welche Rolle soll der Mitarbeiter in diesem Projekt einnehmen?
        </p>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="roleSelect" style="display:block; margin-bottom: 6px; font-weight: 500;">Projekt-Rolle:</label>
          <select id="roleSelect" 
                  [value]="selectedRoleForAssignment()" 
                  (change)="selectedRoleForAssignment.set($any($event.target).value)"
                  style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem;">
            <option value="DEVELOPER">DEVELOPER</option>
            <option value="PROJECT_MANAGER">PROJECT_MANAGER</option>
            <option value="DESIGNER">DESIGNER</option>
            <option value="VIEWER">VIEWER</option>
            <option value="OWNER">OWNER</option>
          </select>
        </div>

        <div class="modal-actions" style="display:flex; justify-content: flex-end; gap: 12px;">
          <button type="button" (click)="onCloseRoleModal()" style="padding: 8px 16px; border: 1px solid #cbd5e1; background: transparent; border-radius: 6px; cursor: pointer;">
            Abbrechen
          </button>
          <button type="button" (click)="onConfirmRoleAssignment()" style="padding: 8px 16px; border: none; background: #2563eb; color: white; border-radius: 6px; font-weight: 500; cursor: pointer;">
            Hinzufügen & Speichern
          </button>
        </div>

      </div>
    </div>
  }

</div>
