<div class="assignment-container">

  <div class="assignment-header">
    <h2 class="page-title">👥 Team-Zuweisung</h2>
    <div class="header-action-zone">
      <app-milestone-selector-component 
        [onlyProjects]="true" 
        [canChooseProject]="true"
        [initialProjectId]="selectedProjectId()" 
        (projectSelected)="onProjectChange($event)">
      </app-milestone-selector-component>
    </div>
  </div>

  <hr class="divider">

  <div class="assignment-content">
    @if (selectedProjectId()) {
    <h3 class="section-title">Projektmitglieder verwalten</h3>

    <!-- 🎯 cdkDropListGroup verbindet automatisch ALLE Unter-Dropzones (Team, Pool & Schlitz) -->
    <div class="assignment-split-view" cdkDropListGroup>

      <app-project-members-list 
        [members]="activeMembers()" 
        (removeUser)="onRemoveUserFromProject($event)"
        (changeRole)="onBadgeClicked($event)"
        (addUser)="onAddUserToProject($event)">
      </app-project-members-list>

      <app-available-pool-list 
        [pool]="availablePool()" 
        (addUser)="onAddUserToProject($event)"
        (onNewUsersInvited)="onNewUsersAdded($event)"
        (removeUser)="onRemoveUserFromProject($event)"
        (removeFromPool)="removeUserFromPool($event)"> 
      </app-available-pool-list>

    </div>
    } @else {
    <div class="empty-state-card">
      <div class="empty-state-icon">📂</div>
      <h4>Bereit für die Team-Zuweisung!</h4>
      <p>Wähle oben rechts dein Projekt aus, um Entwickler, Designer und Manager zuzuweisen oder zu verschieben.</p>
    </div>
    }
  </div>
  
@if (showRoleModal()) {
  <app-select-role-modal
    [options]="projectRoles()"
    [emojiMap]="roleEmojiMap"
    [(selected)]="selectedRoleForAssignment"
    (select)="onConfirmRoleAssignment()"
    (cancel)="onCloseRoleModal()">
  </app-select-role-modal>
}
</div>
