<div class="members-list-container"
      (dragover)="onDragOver($event)"
      (drop)="onDrop($event)"
    >
  <h3>🔴 Projektmitglieder</h3>
  
  @for (member of members(); track member.id) {
    <app-member-card-component
      [user]="member"
      actionType="remove"
      (actionClicked)="onRemove(member.id)"
    >
    </app-member-card-component>
  } @empty {
    <p class="empty-hint">Dieses Projekt hat aktuell noch keine Mitglieder.</p>
  }
</div>
