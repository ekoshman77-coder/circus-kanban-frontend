<div class="members-list-container"
     cdkDropList
     id="assigned-team-list"
     [cdkDropListConnectedTo]="['available-pool-list', 'trash-slot-zone']"
     (cdkDropListDropped)="onDrop($event)">

  <h3>🔵 Zugewiesenes Team</h3>

  @for (member of members(); track member.user.id) {
    <app-member-card-component
      cdkDrag
      [cdkDragData]="member.user.id"
      [user]="member.user"
      [role]="member.projectRole"
      actionType="remove"
      (badgeClicked)="onBadgeClicked(member.user.id)"
      (actionClicked)="onRemove(member.user.id)">
    </app-member-card-component>
  } @empty {
    <p class="empty-hint">Noch keine Mitglieder zugewiesen. Ziehe Karten hierher!</p>
  }
</div>
