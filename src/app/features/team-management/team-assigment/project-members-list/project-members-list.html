<div class="members-list-container"
     (dragover)="onDragOver($event)"
     (drop)="onDrop($event)">
  
  <h3>🔹 Projektmitglieder ({{ members().length }})</h3>
  
  @for (member of members(); track member.user.id) {
    <div class="member-row-wrapper">
      <app-member-card-component
        [user]="member.user"
        [projectRole]="member.projectRole" 
        actionType="remove"
        (actionClicked)="onRemove(member.user.id)">
      </app-member-card-component>
    </div>
  } @empty {
    <p class="empty-hint">Dieses Projekt hat aktuell noch keine Mitglieder.</p>
  }
</div>
