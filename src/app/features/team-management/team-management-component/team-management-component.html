<div class="tab-container">
  
    <div class="management-header">
      <h2>👥 Team- & Projektverwaltung</h2>
      <p>Verwalte deine Mitarbeiter im globalen Pool oder weise sie deinen aktuellen Projekten zu.</p>
    </div>

    <div class="tab-buttons">
    <button 
      (click)="setTab('gallery')" 
      [class.active]="activeTab() === 'gallery'">
      👥 Team-Galerie
    </button>

    <button 
      (click)="setTab('assignment')" 
      [class.active]="activeTab() === 'assignment'">
      💼 Projekte zuweisen
    </button>
  </div>

  <div class="tab-content">
    @if (activeTab() === 'gallery') {
      <app-team-pool></app-team-pool>
    } @else if (activeTab() === 'assignment') {
      <app-team-assignment></app-team-assignment>
    }
  </div>
</div>
