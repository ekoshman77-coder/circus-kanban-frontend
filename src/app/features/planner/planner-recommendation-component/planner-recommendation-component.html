<div class="planner-panel">
  <div class="recommendations-grid">
    @for (rec of visibleList(); track rec.todo.id) {
      <app-recommendation-card 
        [item]="rec" 
        [roundId]="roundId()"
        [acceptText]="'🚀 Anpacken'"
        (accepted)="onCardAccepted($event)"
        (rejected)="onCardRejected($event)">
      </app-recommendation-card>
    }
  </div>
</div>
