<div class="app">
  <header class="app-header-bar">

    <div class="nav-group left-group">
      <button routerLink="/" routerLinkActive="active-route" [routerLinkActiveOptions]="{ exact: true }"
        class="nav-tab icon-tab">
        <span class="tab-icon">🏠</span>
        <span class="tab-text">Startseite</span>
      </button>

      <div class="title-container">
        <app-apptitle></app-apptitle>
      </div>
    </div>

    <div class="nav-group right-group">
      <button routerLink="/todopage" routerLinkActive="active-route" class="nav-tab icon-tab">
        <span class="tab-icon">📋</span>
        <span class="tab-text">Aufgaben & Board</span>
      </button>

      <button routerLink="/statistics" routerLinkActive="active-route" class="nav-tab icon-tab">
        <span class="tab-icon">📈</span>
        <span class="tab-text">Statistiken</span>
      </button>

      <button routerLink="/planner" routerLinkActive="active-route" class="nav-tab icon-tab">
        <span class="tab-icon">🧩</span>
        <span class="tab-text">Smart Planner</span>
      </button>

      <button routerLink="/focus" routerLinkActive="active-route" class="nav-tab icon-tab">
        <span class="tab-icon">⏳</span>
        <span class="tab-text">Fokus-Timer</span>
      </button>

      <button routerLink="/quick-center" routerLinkActive="active-route" class="nav-tab icon-tab">
        <span class="tab-icon">🎛️</span>
        <span class="tab-text">Quick-Center</span>
      </button>

      <button routerLink="/ideas" routerLinkActive="active-route" class="nav-tab icon-tab">
        <span class="tab-icon">💡</span>
        <span class="tab-text">Ideas</span>
      </button>
      <button routerLink="/team" routerLinkActive="active-route" class="nav-tab icon-tab">
        <span class="tab-icon">👥</span>
        <span class="tab-text">Team-Verwaltung</span>
      </button>
      
    </div>

  </header>

  <main class="content-container">

    @if (showOfflineBanner()) {
    <div class="global-offline-banner">
      <div class="banner-content">
        <span class="banner-icon">🔌</span>
        <div class="banner-text">
          <strong>Aktion blockiert:</strong> Diese Seite oder Funktion ist im Offline-Modus nicht verfügbar.
        </div>
      </div>
      <button (click)="closeBanner()" class="banner-close-btn">&times;</button>
    </div>
    }

    <router-outlet></router-outlet>
  </main>
</div>
