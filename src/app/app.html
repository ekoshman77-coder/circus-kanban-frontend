<div class="app">
  <header class="app-header-bar">

    <!-- LINKS: Startseite + Titel -->
    <div class="nav-group left-group">
      <button routerLink="/" routerLinkActive="active-route" [routerLinkActiveOptions]="{ exact: true }"
        class="nav-tab icon-tab" data-tooltip="Startseite">
        <span class="tab-icon">🏠</span>
      </button>

      <div class="title-container">
        <app-apptitle></app-apptitle>
      </div>
    </div>

    <!-- RECHTS: Suche + Haupt-Tabs + Tools-Dropdown -->
    <div class="nav-group right-group">
      <div class="header-search-wrapper">
        <app-search-center-component></app-search-center-component>
      </div>

      <!-- 1. Haupt-Tab: Aufgaben -->
      <button routerLink="/todopage" routerLinkActive="active-route" class="nav-tab icon-tab" data-tooltip="Aufgaben & Board">
        <span class="tab-icon">📋</span>
      </button>

      <!-- 2. Haupt-Tab: Ideen -->
      <button routerLink="/ideas" routerLinkActive="active-route" class="nav-tab icon-tab" data-tooltip="Ideen">
        <span class="tab-icon">💡</span>
      </button>

      <!-- 3. Haupt-Tab: Team -->
      <button routerLink="/team" routerLinkActive="active-route" class="nav-tab icon-tab" data-tooltip="Team-Verwaltung">
        <span class="tab-icon">👥</span>
      </button>

      <!-- 🧰 TOOLS & ADMIN DROPDOWN -->
      <div class="tools-dropdown-container">
        <button class="nav-tab icon-tab tools-btn">
          <span class="tab-icon">🧰</span>
          <span class="tools-label">Tools</span>
          <span class="dropdown-arrow">▾</span>
        </button>

        <div class="tools-dropdown-menu">
          <a routerLink="/planner" routerLinkActive="active-dropdown-item" class="dropdown-item">
            <span class="item-icon">🧩</span>
            <span class="item-text">Smart Planner</span>
          </a>

          <a routerLink="/focus" routerLinkActive="active-dropdown-item" class="dropdown-item">
            <span class="item-icon">⏳</span>
            <span class="item-text">Fokus-Timer</span>
          </a>

          <a routerLink="/statistics" routerLinkActive="active-dropdown-item" class="dropdown-item">
            <span class="item-icon">📈</span>
            <span class="item-text">Statistiken</span>
          </a>

          <a routerLink="/quick-center" routerLinkActive="active-dropdown-item" class="dropdown-item">
            <span class="item-icon">🎛️</span>
            <span class="item-text">Quick-Center</span>
          </a>

          @if (isAdmin()) {
            <div class="dropdown-divider"></div>
            <a routerLink="/admin" routerLinkActive="active-dropdown-item" class="dropdown-item admin-item">
              <span class="item-icon">🛡️</span>
              <span class="item-text">Admin-Board</span>
            </a>
          }
        </div>
      </div>

    </div>

  </header>

  <main class="content-container">
    <app-notification-component></app-notification-component>
    @if (showOfflineBanner()) {
    <div class="global-offline-banner">
      <div class="banner-content">
        <span class="banner-icon">🔌</span>
        <div class="banner-text">
          <strong>Aktion blockiert:</strong> Diese Seite oder Funktion ist im Offline-Modus nicht verfügbar.
        </div>
      </div>
      <button (click)="closeBanner()" class="banner-close-btn">&times;</button>
    </div>
    }

    <router-outlet></router-outlet>
  </main>
</div>

<app-streak-panel [streakData]="todoService.streakState()"></app-streak-panel>
