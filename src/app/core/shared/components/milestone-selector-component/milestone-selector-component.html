<div class="milestone-selector-container">
  
  <button type="button" 
          class="selector-trigger" 
          [disabled]="isDisabled()" 
          (click)="toggleDropdown()">
    🏁 {{ currentMilestoneTitle() }}
  </button>

  @if (!isDisabled() && isOpen()) {
    <div class="floating-popup">
      <input type="text" 
      placeholder="Meilenstein suchen..." 
      (input)="onSearch($event)"
      (keydown.escape)="closeDropdown()"
      (blur)="onInputBlur()"
      >
      
      <div class="projects-list">
        @for (project of filteredProjectsWithMilestones(); track project.id) {
          <div class="project-group">

              <button type="button" 
                    class="project-header-btn"
                    [disabled]="!canChooseProject()"
                    (click)="selectProject(project.id)"
                    [title]="canChooseProject() ? 'Das gesamte Projekt anzeigen' : ''">
              <span class="folder-icon">📁</span> 
              <span class="project-title-text">{{ project.title }}</span>
              
              <!-- Das kleine Badge zeigen wir nur im Team-Board an, um die Funktion anzudeuten -->
              @if (canChooseProject()) {
                <span class="all-badge">Alle Phasen</span>
              }
            </button>
            @for (milestone of project.milestones; track milestone.id) {
              <button type="button" class="milestone-item" (click)="selectMilestone(milestone.id)">
                🏁 {{ milestone.title }}
              </button>
            }
          </div>
        } @empty {
          <div class="no-results">Keine offenen Meilensteine gefunden...</div>
        }
      </div>
    </div>
  }
</div>
